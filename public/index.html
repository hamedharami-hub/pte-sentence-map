<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="بانک جمله‌های موضوعی و پرکاربرد برای PTE Essay">
    <meta property="og:title" content="جمله‌یار PTE">
    <meta property="og:description" content="بانک جمله‌های موضوعی و پرکاربرد برای PTE Essay">
    <title>جمله‌یار PTE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2.5">
  </head>
  <body>
    <main class="app">
      <header>
        <a class="brand" href="#" aria-label="صفحهٔ اصلی جمله‌یار"><i aria-hidden="true">✦</i><span>جمله‌یار<small>PTE Sentence Map</small></span></a>
        <nav role="tablist" aria-label="بخش‌های برنامه">
          <button type="button" class="tab active" data-view="engines" role="tab">موتور جمله</button>
          <button type="button" class="tab" data-view="topics" role="tab">موضوع‌ها</button>
          <button type="button" class="tab" data-view="starred" role="tab">منتخب من <b id="starCount">۰</b></button>
          <button type="button" class="tab" data-view="flagged" role="tab">مرور حفظی <b id="flagCount">۰</b></button>
          <button type="button" class="tab" data-view="practice" role="tab">تمرین حفظ</button>
        </nav>
      </header>
      <section class="intro"><h1>جمله‌های <em id="titleText">هوشمند و تأییدشده</em></h1><p id="subtitle">یک خانواده جمله را انتخاب کن؛ فقط جای‌خالی‌ها و نسخه‌های سازگار نمایش داده می‌شوند.</p></section>
      <section id="engineWorkspace" class="engine-workspace" aria-label="ساخت جمله با موتورهای تأییدشده"></section>
      <section id="practiceWorkspace" class="practice-workspace" aria-label="تمرین حفظ جمله" hidden></section>
      <div id="topicWorkspace">
        <div id="topics" class="topics" aria-label="موضوع‌های اصلی"></div>
        <div id="subtopics" class="subtopics" aria-label="زیرموضوع‌ها"></div>
        <label class="search" for="search"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="جست‌وجو در جمله‌های انگلیسی…"><button id="clearSearch" type="button" aria-label="پاک‌کردن جست‌وجو" hidden>×</button></label>
      </div>
      <div id="listHead" class="list-head"><span id="resultCount" aria-live="polite">در حال بارگذاری…</span><button id="onlyP1" type="button" class="filter" aria-pressed="false">فقط P1</button></div>
      <section id="cards" class="cards" aria-label="جمله‌ها"></section>
      <p id="loading" class="empty">در حال آماده‌کردن جمله‌ها…</p><p id="empty" class="empty" hidden></p><p id="loadError" class="empty error" hidden>داده‌ها بارگذاری نشد. لطفاً صفحه را دوباره باز کن.</p>
      <p id="status" class="sr-only" aria-live="polite"></p>
    </main>
    <script>
      window.escapeHtml = function(str) {
        return String(str ?? '').replace(/[&<>'"]/g, function(tag) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag;
        });
      };
    </script>
    <script src="app.js?v=2.5"></script>
  </body>
</html>
